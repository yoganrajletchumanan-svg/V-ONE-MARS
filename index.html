<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-ONE MARS Interface</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004085;
            --brand-dark: #003366;
            --text-dark: #334155;
            --text-muted: #475569;
            --bg-page: #f8fafc;
            --grid-line: #e2e8f0;
            --card-bg: #ffffff;
            --box-bg: #f4f7fa;
            --border-light: #e6ecf1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Full Screen Grid Background */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        /* The Main Centered Card */
        .mars-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 40px 32px 32px 32px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.03);
            text-align: center;
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Top Icon Box */
        .icon-box {
            width: 64px;
            height: 52px;
            margin: 0 auto 20px auto;
            background-color: var(--box-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        /* Brand Title & Status Indicator */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 800;
            color: var(--brand-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .status-halo {
            background-color: #dcfce7;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        /* Welcome Text Box */
        .welcome-box {
            background-color: var(--box-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 32px;
        }

        .welcome-box p {
            font-size: 14.5px;
            line-height: 1.6;
            font-weight: 500;
            color: var(--text-muted);
            margin: 0;
        }

        /* Main Chat Button */
        .chat-btn-wrapper {
            display: flex;
            justify-content: center;
            padding-bottom: 8px;
        }

        .chat-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(0, 86, 179, 0.25);
            transition: all 0.3s ease;
        }

        .chat-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(0, 86, 179, 0.35);
        }

        .chat-btn svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .mars-card {
                padding: 32px 20px;
                border-radius: 24px;
            }
            .welcome-box {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="mars-card">
        
        <div class="icon-box">
            <svg viewBox="0 0 24 24" style="width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;">
                <rect x="6" y="14" width="12" height="4" rx="1"></rect>
                <line x1="12" y1="14" x2="12" y2="6"></line>
                <path d="M9 6h6"></path>
            </svg>
        </div>

        <div class="brand-header">
            <div class="status-halo">
                <div class="status-dot"></div>
            </div>
            V-ONE MARS
        </div>

        <div class="welcome-box">
            <p>Welcome to V-ONE MARS Intelligence Support. I'm here to answer questions about machine data, system insights, technical details, and operational performance.</p>
        </div>

        <!-- Custom Trigger Button -->
        <div class="chat-btn-wrapper">
            <button id="chat-button" class="chat-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>
        </div>

    </div>

    <!-- 1. LOAD SCRIPT LAST AS REQUESTED -->
    <script src="https://cloud.v-one.my/public/chat/widget.js?appId=e2110aef-516d-4806-ba85-1b58e72c74b8&title=V-ONE+MARS"></script>

    <!-- 2. DEEP SEARCH CLICK HANDLER -->
    <script>
        document.getElementById('chat-button').addEventListener('click', function(e) {
            e.preventDefault();
            let widgetOpened = false;

            // Method A: Check for Flowise-style Shadow DOM elements
            const shadowHosts = document.querySelectorAll('flowise-chatbot, dify-chatbot, *');
            for(let host of shadowHosts) {
                if (host.shadowRoot) {
                    // Look for a button inside the shadow DOM and click it
                    const btn = host.shadowRoot.querySelector('button');
                    if (btn) {
                        btn.click();
                        widgetOpened = true;
                        break;
                    }
                }
            }

            // Method B: Try common global API functions if Shadow DOM fails
            if (!widgetOpened) {
                if (typeof window.Chatbot !== 'undefined' && typeof window.Chatbot.open === 'function') {
                    window.Chatbot.open();
                    widgetOpened = true;
                }
            }

            // Fallback warning if clicked too quickly before script loads
            if (!widgetOpened) {
                console.log("Widget script is either still loading, or the default bubble is hidden.");
            }
        });
    </script>
</body>
</html>
